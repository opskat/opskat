name: Manual Build
run-name: Manual build ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      darwin_arm64:
        description: "Build darwin-arm64"
        required: false
        default: true
        type: boolean
      darwin_amd64:
        description: "Build darwin-amd64"
        required: false
        default: true
        type: boolean
      linux_amd64:
        description: "Build linux-amd64"
        required: false
        default: true
        type: boolean
      linux_arm64:
        description: "Build linux-arm64"
        required: false
        default: true
        type: boolean
      windows_amd64:
        description: "Build windows-amd64"
        required: false
        default: true
        type: boolean
      windows_arm64:
        description: "Build windows-arm64"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare manual build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail

          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          BASE_VERSION="${LATEST_TAG#v}"
          DATE=$(date -u +%Y%m%d)
          BUILD_META="manual.${DATE}.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          if [[ "$BASE_VERSION" == *-* ]]; then
            VERSION="v${BASE_VERSION}.${BUILD_META}"
          else
            VERSION="v${BASE_VERSION}-${BUILD_META}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Select platforms
        id: platforms
        env:
          BUILD_DARWIN_ARM64: ${{ inputs.darwin_arm64 }}
          BUILD_DARWIN_AMD64: ${{ inputs.darwin_amd64 }}
          BUILD_LINUX_AMD64: ${{ inputs.linux_amd64 }}
          BUILD_LINUX_ARM64: ${{ inputs.linux_arm64 }}
          BUILD_WINDOWS_AMD64: ${{ inputs.windows_amd64 }}
          BUILD_WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
        run: |
          set -euo pipefail
          SELECTED=()
          [ "$BUILD_DARWIN_ARM64" = "true" ]  && SELECTED+=("darwin-arm64")  || true
          [ "$BUILD_DARWIN_AMD64" = "true" ]  && SELECTED+=("darwin-amd64")  || true
          [ "$BUILD_LINUX_AMD64" = "true" ]   && SELECTED+=("linux-amd64")   || true
          [ "$BUILD_LINUX_ARM64" = "true" ]   && SELECTED+=("linux-arm64")   || true
          [ "$BUILD_WINDOWS_AMD64" = "true" ] && SELECTED+=("windows-amd64") || true
          [ "$BUILD_WINDOWS_ARM64" = "true" ] && SELECTED+=("windows-arm64") || true
          if [ "${#SELECTED[@]}" -eq 0 ]; then
            echo "::error::Select at least one platform to build."
            exit 1
          fi
          PLATFORMS=$(printf '%s\n' "${SELECTED[@]}" | paste -sd ',' -)
          echo "Selected platforms: ${PLATFORMS}"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: [prepare]
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit-id: ${{ needs.prepare.outputs.sha }}
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-prefix: manual
      platforms: ${{ needs.prepare.outputs.platforms }}
      if-no-files-found: error
    secrets: inherit

  checksums:
    name: Generate checksums
    needs: [prepare, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: manual-opskat-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: manual-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
