name: SSH Agent Real Fixtures

# CI wiring sketch for task 12 of the ssh-agent-auth plan (cross-platform real
# fixtures). Manual-only (workflow_dispatch) so the untested Windows named-pipe
# path can never break normal PR CI; once validated, add `pull_request:` to the
# triggers to gate PRs.
#
# - unix job: real system ssh-agent over a real unix socket (run.sh) on
#   ubuntu-latest and macos-latest. The same job is what a release workflow
#   calls to satisfy the spec's "跨平台真实 fixture" row.
# - windows job: OpenSSH-compatible named-pipe fixtures served by the test
#   itself (self-contained keyring agent; no dependency on the OpenSSH agent
#   service), run under the RACE DETECTOR (go test -race) as the spec requires:
#   "Windows named-pipe 取消路径在竞态检测器下运行".
on:
  workflow_dispatch:

jobs:
  unix:
    name: Unix socket fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run real unix-socket fixtures
        run: bash scripts/ssh-agent-fixtures/run.sh
      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-agent-fixture-unix-${{ matrix.os }}
          path: scripts/ssh-agent-fixtures/out/
          if-no-files-found: ignore

  windows:
    name: Windows named-pipe fixtures (race)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run real named-pipe fixtures under the race detector
        shell: bash
        run: bash scripts/ssh-agent-fixtures/run-windows.sh
      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-agent-fixture-windows
          path: scripts/ssh-agent-fixtures/out/
          if-no-files-found: ignore
