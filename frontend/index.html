<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>OpsKat</title>
    <script>
      // 防闪烁：在 React 加载前立即应用主题
      (function() {
        var theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* 启动加载界面：窗口以隐藏状态启动，这块画出来才显示窗口（见 BootScreenShown），
         React 首次提交后由 DismissBootScreen 淡出移除。样式表在首帧前已就位，token 可用。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--background);
        color: var(--muted-foreground);
        --wails-draggable: drag;
        transition: opacity 200ms ease-out;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      #boot .boot-logo-dark,
      .dark #boot .boot-logo-light {
        display: none;
      }
      .dark #boot .boot-logo-dark {
        display: block;
      }
      #boot svg {
        width: 20px;
        height: 20px;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
</head>
<body>
<div id="root"></div>
<div id="boot" aria-busy="true">
  <img class="boot-logo-light" src="/src/assets/images/logo.png" alt="OpsKat"/>
  <img class="boot-logo-dark" src="/src/assets/images/logo-dark.png" alt="OpsKat"/>
  <!-- lucide Loader2 -->
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
</div>
<script>
  // 加载界面已在 DOM 中：通知后端显示隐藏启动的窗口（Wails 在 <head> 同步注入了绑定）。
  window.go.system.System.BootScreenShown();
</script>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
